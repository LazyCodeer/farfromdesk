name: Desktop quick checks
on:
  workflow_call:
  pull_request:
    paths: ['desktop/**', 'src/**', 'native/**', 'skills/**', 'test/**', 'install/**', 'script/**', 'package*.json', 'tsconfig.json', '.github/workflows/desktop*.yml']
permissions:
  contents: read
concurrency:
  group: desktop-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.20.0', cache: npm}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.47.7', channel: stable, cache: true}
      - run: npm ci
      - run: npm run check
      - run: npm run test:portable
      - run: python -m unittest discover -s script/tests
      - run: python test/installers_test.py
      - run: flutter pub get
        working-directory: desktop
      - run: flutter analyze
        working-directory: desktop
      - run: flutter test
        working-directory: desktop
