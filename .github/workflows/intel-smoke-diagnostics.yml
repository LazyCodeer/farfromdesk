name: Intel smoke diagnostics (no publish)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to compile for this isolated diagnostic
        type: string
        default: '0.9.4'
  pull_request:
    paths:
      - '.github/workflows/intel-smoke-diagnostics.yml'
      - 'script/intel_diagnostic_heartbeat.mjs'
      - 'script/intel_smoke_observer.py'
      - 'script/run_intel_diagnostic.sh'
      - 'script/intel-smoke-diagnostics.md'
      - 'script/tests/test_intel_smoke_observer.py'
      - 'desktop/lib/main.dart'
      - 'desktop/lib/startup_trace.dart'
      - 'desktop/lib/native_gateway.dart'
      - 'desktop/test/desktop_startup_test.dart'
permissions:
  contents: read
  actions: read
jobs:
  intel:
    name: intel-diagnostic
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      WSB_TARGET_ARCH: x86_64
      FFD_DIAGNOSTIC_VERSION: ${{ inputs.version || '0.9.4' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.20.0', cache: npm}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.47.7', channel: stable, cache: true}
      - name: Validate diagnostic version
        run: python -c 'import os,re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",os.environ["FFD_DIAGNOSTIC_VERSION"])'
      - run: npm ci
      - run: npm run check
      - run: python -m unittest discover -s script/tests
      - run: npm run test:portable
      - run: python test/installers_test.py
      - run: flutter pub get
        working-directory: desktop
      - name: Build the same Intel application
        working-directory: desktop
        run: |
          build=$(python -c 'import json; print(json.load(open("../release.json"))["build"])')
          flutter build macos --release --build-name "$FFD_DIAGNOSTIC_VERSION" --build-number "$build" --dart-define="FFD_VERSION=$FFD_DIAGNOSTIC_VERSION"
      - name: Restore pinned speech build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: speech-v1-macos-15-intel-${{ hashFiles('script/build_speech_runtime.py', 'script/speech_cpu/**') }}
          path: |
            build/speech-toolchain*
            build/speech-runtime*
      - run: python script/build_speech_runtime.py
      - run: npm run desktop:backend
      - run: node script/smoke_desktop_backend.mjs
      - run: node script/smoke_desktop_driver.mjs
      - run: node script/test_desktop_speech.mjs
        timeout-minutes: 5
      - run: python script/package_desktop.py --version "$FFD_DIAGNOSTIC_VERSION"
      - run: node script/smoke_desktop_driver.mjs 'build/desktop-release/stage/FarFromDesk.app/Contents/Resources/backend/native'
      - name: Observe the unchanged packaged-app smoke test
        timeout-minutes: 4
        run: bash script/run_intel_diagnostic.sh
      - name: Save bounded process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intel-smoke-diagnostics
          path: ${{ runner.temp }}/intel-diagnostic.jsonl
          if-no-files-found: ignore
          retention-days: 3
  server-observer:
    name: server-observer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Observe GitHub job status independently
        run: |
          for i in $(seq 1 85); do
            line=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name == "intel-diagnostic") | [.status, (.conclusion // "pending")] | @tsv' 2>/dev/null || true)
            printf '%s sample=%s server-status %s\n' "$(date -u +%FT%TZ)" "$i" "${line:-unavailable}"
            case "$line" in completed*) break;; esac
            sleep 30
          done
