name: FarFromDesk desktop release
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (all is required to publish)'
        type: choice
        default: linux
        options: [linux, windows, macos-arm64, macos-x64, all]
      publish:
        description: 'Publish a complete public release from main'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['release.json', 'desktop/**', 'src/**', 'native/**', 'skills/**', 'test/**', 'install/**', 'script/**', 'package*.json', 'tsconfig.json', '.github/workflows/desktop*.yml']
permissions:
  contents: read
concurrency:
  group: shared-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.version.outputs.matrix }}
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      app: ${{ steps.version.outputs.app }}
      build: ${{ steps.version.outputs.build }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Read release history
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh api --paginate --slurp "repos/$RELEASE_REPO/releases?per_page=100" > "$RUNNER_TEMP/release-pages.json"
          jq 'add' "$RUNNER_TEMP/release-pages.json" > "$RUNNER_TEMP/releases.json"
      - id: version
        env:
          FFD_RUN: ${{ github.run_id }}
          FFD_NUMBER: ${{ github.run_number }}
          FFD_RELEASE_HISTORY: ${{ runner.temp }}/releases.json
          FFD_SHA: ${{ github.sha }}
          FFD_EVENT: ${{ github.event_name }}
          FFD_REF: ${{ github.ref }}
          FFD_TARGET: ${{ inputs.target }}
          FFD_PUBLISH: ${{ inputs.publish }}
        run: python3 script/desktop_ci_plan.py
  checks:
    if: needs.version.outputs.skip != 'true'
    needs: version
    uses: ./.github/workflows/desktop-checks.yml
  desktop:
    if: needs.version.outputs.skip != 'true'
    needs: [version, checks]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      WSB_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.20.0', cache: npm}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.47.7', channel: stable, cache: true}
      - if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb libgl1-mesa-dri
      - run: npm ci
      - run: npm run check
      - run: python -m unittest discover -s script/tests
      - run: npm run test:portable
      - if: matrix.runner == 'macos-15'
        run: npm test
      - if: runner.os != 'Windows'
        run: python test/installers_test.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          ./install/install.ps1 -DryRun
      - run: flutter pub get
        working-directory: desktop
      - run: flutter build ${{ matrix.target }} --release --build-name ${{ needs.version.outputs.app }} --build-number ${{ needs.version.outputs.build }} --dart-define=FFD_VERSION=${{ needs.version.outputs.version }}
        working-directory: desktop
      - name: Restore pinned speech build cache
        id: speech-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: speech-v1-${{ matrix.runner }}-${{ hashFiles('script/build_speech_runtime.py', 'script/speech_cpu/**') }}
          path: |
            build/speech-toolchain*
            build/speech-runtime*
      - name: Build bundled local speech
        env:
          FFD_MSYS_BASH: ${{ steps.msys.outputs.msys2-location }}/usr/bin/bash.exe
        run: python script/build_speech_runtime.py
      - name: Save compiled pinned speech tools
        if: steps.speech-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.speech-cache.outputs.cache-primary-key }}
          path: |
            build/speech-toolchain*
            build/speech-runtime*
      - run: npm run desktop:backend
      - run: node script/smoke_desktop_backend.mjs
      - if: runner.os == 'macOS'
        run: node script/smoke_desktop_driver.mjs
      - run: node script/test_desktop_speech.mjs
        timeout-minutes: 5
      - name: Verify tracked release source before packaging
        run: |
          git status --short --untracked-files=no
          git diff --stat HEAD --
          git diff --quiet HEAD --
      - run: python script/package_desktop.py --version ${{ needs.version.outputs.version }}
      - if: runner.os == 'macOS'
        run: node script/smoke_desktop_driver.mjs 'build/desktop-release/stage/FarFromDesk.app/Contents/Resources/backend/native'
      - if: runner.os == 'Windows'
        name: Verify EXE install and uninstall
        run: python script/test_windows_installer.py --version ${{ needs.version.outputs.version }}
        timeout-minutes: 6
      - if: runner.os == 'Linux'
        run: xvfb-run -a node script/smoke_desktop_app.mjs
        timeout-minutes: 4
      - if: runner.os != 'Linux'
        run: node script/smoke_desktop_app.mjs
        timeout-minutes: 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: farfromdesk-${{ matrix.runner }}
          path: |
            build/desktop-release/*.dmg
            build/desktop-release/*.zip
            build/desktop-release/*-setup.exe
            build/desktop-release/*.tar.gz
            build/desktop-release/*.sha256
            build/desktop-release/*.json
            build/desktop-release/install/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  publish:
    if: needs.version.outputs.publish == 'true' && needs.version.outputs.skip != 'true' && github.ref == 'refs/heads/main'
    needs: [version, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: farfromdesk-*
          path: build/publish
      - name: Require the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: test "$(gh api "repos/$RELEASE_REPO/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_COMMIT"
      - name: Publish all verified desktop targets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 script/publish_desktop_release.py --assets build/publish --repo "$RELEASE_REPO" --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT"
