name: FarFromDesk desktop release
on:
  workflow_dispatch:
  push:
    branches: [main, codex/shared-desktop]
  pull_request:
    paths: ['desktop/**', 'src/**', 'install/**', 'script/**', 'package*.json', '.github/workflows/desktop.yml']
permissions:
  contents: read
concurrency:
  group: shared-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      app: ${{ steps.version.outputs.app }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - id: version
        env:
          FFD_RUN: ${{ github.run_id }}
          FFD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYCODE'
          import json,os,re
          from pathlib import Path
          d=json.loads(Path('release.json').read_text())
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',d['version'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"version={d['version']}-preview.{int(os.environ['FFD_RUN'])}\n")
              f.write(f"app={d['version']}\n")
              f.write(f"build={max(d['build'],2000+int(os.environ['FFD_NUMBER']))}\n")
          PYCODE
  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, target: macos, arch: x86_64}
          - {runner: macos-15, target: macos, arch: arm64}
          - {runner: ubuntu-22.04, target: linux, arch: x86_64}
          - {runner: windows-2022, target: windows, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      WSB_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.20.0', cache: npm}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.47.7', channel: stable, cache: true}
      - if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb libgl1-mesa-dri
      - run: npm ci
      - run: npm run check
      - run: python -m unittest discover -s script/tests
      - run: npm run test:portable
      - if: runner.os == 'macOS'
        run: npm test
      - if: runner.os != 'Windows'
        run: python test/installers_test.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          ./install/install.ps1 -DryRun
      - run: flutter pub get
        working-directory: desktop
      - run: flutter analyze
        working-directory: desktop
      - run: flutter test
        working-directory: desktop
      - run: flutter build ${{ matrix.target }} --release --build-name ${{ needs.version.outputs.app }} --build-number ${{ needs.version.outputs.build }} --dart-define=FFD_VERSION=${{ needs.version.outputs.version }}
        working-directory: desktop
      - name: Restore pinned speech build cache
        id: speech-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: speech-v1-${{ matrix.runner }}-${{ hashFiles('script/build_speech_runtime.py', 'script/speech_cpu/**') }}
          path: |
            build/speech-toolchain*
            build/speech-runtime*
      - name: Build bundled local speech
        env:
          FFD_MSYS_BASH: ${{ steps.msys.outputs.msys2-location }}/usr/bin/bash.exe
        run: python script/build_speech_runtime.py
      - name: Save compiled pinned speech tools
        if: steps.speech-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.speech-cache.outputs.cache-primary-key }}
          path: |
            build/speech-toolchain*
            build/speech-runtime*
      - run: npm run desktop:backend
      - run: node script/smoke_desktop_backend.mjs
      - run: node script/test_desktop_speech.mjs
        timeout-minutes: 5
      - run: python script/package_desktop.py --version ${{ needs.version.outputs.version }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a node script/smoke_desktop_app.mjs
      - if: runner.os != 'Linux'
        run: node script/smoke_desktop_app.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: farfromdesk-${{ matrix.runner }}
          path: |
            build/desktop-release/*.dmg
            build/desktop-release/*.zip
            build/desktop-release/*.tar.gz
            build/desktop-release/*.sha256
            build/desktop-release/*.json
            build/desktop-release/install/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [version, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: farfromdesk-*
          path: build/publish
      - name: Publish all verified desktop targets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 script/publish_desktop_release.py --assets build/publish --repo "$RELEASE_REPO" --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT"
