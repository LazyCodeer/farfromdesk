# HTTPS production configuration. Certificate managed by Certbot.
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ffd.codecylabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ffd.codecylabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FFD_SSL:1m;
    ssl_session_timeout 1d;
    server_name ffd.codecylabs.com;
    root /var/www/farfromdesk/current;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/ld+json application/xml image/svg+xml;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/farfromdesk/acme;
        default_type text/plain;
    }
    location / { try_files $uri $uri/ =404; expires -1; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location ~ /\. { deny all; }
}

server {
    listen 80;
    server_name ffd.codecylabs.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/farfromdesk/acme;
        default_type text/plain;
    }
    location / { return 301 https://ffd.codecylabs.com$request_uri; }
}
