server {
    listen 80;
    server_name farfromdesk.com www.farfromdesk.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/farfromdesk/acme; default_type text/plain; }
    location / { return 301 https://farfromdesk.com$request_uri; }
}

server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/farfromdesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farfromdesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name www.farfromdesk.com;
    server_tokens off;
    return 301 https://farfromdesk.com$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/farfromdesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farfromdesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name farfromdesk.com;
    root /var/www/farfromdesk/current;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/ld+json application/xml image/svg+xml;
    location ^~ /.well-known/acme-challenge/ { root /var/www/farfromdesk/acme; default_type text/plain; }
    location = /install.sh { return 302 https://github.com/LazyCodeer/farfromdesk/releases/latest/download/install.sh; }
    location = /install.ps1 { return 302 https://github.com/LazyCodeer/farfromdesk/releases/latest/download/install.ps1; }
    location ^~ /remote/ { root /var/www/farfromdesk; try_files $uri $uri/ =404; expires -1; }
    location / { try_files $uri $uri/ =404; expires -1; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location ~ /\. { deny all; }
}
