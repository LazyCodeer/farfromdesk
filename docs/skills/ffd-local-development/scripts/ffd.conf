# Paths ffd uses. Every value can also be set in the environment, which wins over
# this file, so a session with a different source or Flutter install changes one
# file or exports one variable instead of editing the script.

# The checkout that builds Local. This is a real git checkout shared with other
# sessions, NOT the ignored snapshot current-state.md described in October.
FFD_SOURCE=/private/tmp/ffd-pr

# Flutter lives on another volume, so every flutter command writes outside the
# session workspace and needs the file sandbox widened (`danger-full-access` or an
# explicit allow for its bin/cache). This is the single biggest source of
# approval prompts in a Local task.
FFD_FLUTTER=/Volumes/Personal/DevTools/flutter/bin/flutter

FFD_INSTALLED="$HOME/Applications/FarFromDesk Local.app"
FFD_BUILDS=/Volumes/Personal/Developer/FarFromDesk/Builds
FFD_STATE="$HOME/Library/Application Support/FarFromDesk Local"
FFD_PORT=47961
FFD_SKILL="$HOME/.codex/skills/ffd-local-development"

# Default stage-folder and buildId tag: local-<note>-<build>.
FFD_NOTE=settings